<!-- @dsCard group="Spacing" viewport="700x340" name="Spacing & Radii" subtitle="4px grid, border radii, control heights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
html,body{margin:0}
body{background:var(--vela-bg);padding:20px;font-family:var(--font-sans)}
h3{font:var(--type-caption);color:var(--vela-text-3);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin:0 0 10px}
.row{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.spc{display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{background:var(--vela-primary);border-radius:2px;width:20px;opacity:0.85}
.lbl{font:var(--type-caption);color:var(--vela-text-3);font-variant-numeric:tabular-nums}
.radii{display:flex;gap:10px;margin-bottom:20px}
.rad{width:54px;height:54px;background:var(--vela-surface-2);border:1px solid var(--vela-border);display:flex;align-items:center;justify-content:center;font:var(--type-caption);color:var(--vela-text-3)}
.controls{display:flex;gap:10px;margin-bottom:4px}
.ctrl{background:var(--vela-surface-2);border:1px solid var(--vela-border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--type-caption);color:var(--vela-text-3);padding:0 12px}
</style>
</head>
<body class="vela-root">
  <h3>Spacing scale — 4px grid</h3>
  <div class="row">
    <div class="spc"><div class="bar" style="height:4px"></div><span class="lbl">4</span></div>
    <div class="spc"><div class="bar" style="height:8px"></div><span class="lbl">8</span></div>
    <div class="spc"><div class="bar" style="height:12px"></div><span class="lbl">12</span></div>
    <div class="spc"><div class="bar" style="height:16px"></div><span class="lbl">16</span></div>
    <div class="spc"><div class="bar" style="height:20px"></div><span class="lbl">20</span></div>
    <div class="spc"><div class="bar" style="height:24px"></div><span class="lbl">24</span></div>
    <div class="spc"><div class="bar" style="height:32px"></div><span class="lbl">32</span></div>
    <div class="spc"><div class="bar" style="height:40px"></div><span class="lbl">40</span></div>
    <div class="spc"><div class="bar" style="height:48px"></div><span class="lbl">48</span></div>
    <div class="spc"><div class="bar" style="height:64px"></div><span class="lbl">64</span></div>
    <div class="spc"><div class="bar" style="height:80px"></div><span class="lbl">80</span></div>
  </div>
  <h3>Border radii</h3>
  <div class="radii">
    <div class="rad" style="border-radius:var(--radius-xs)">xs·4</div>
    <div class="rad" style="border-radius:var(--radius-sm)">sm·6</div>
    <div class="rad" style="border-radius:var(--radius-md)">md·10</div>
    <div class="rad" style="border-radius:var(--radius-lg)">lg·14</div>
    <div class="rad" style="border-radius:var(--radius-xl)">xl·18</div>
    <div class="rad" style="border-radius:var(--radius-2xl)">2xl·24</div>
    <div class="rad" style="border-radius:var(--radius-full);width:54px">full</div>
  </div>
  <h3>Control heights</h3>
  <div class="controls">
    <div class="ctrl" style="height:var(--control-sm)">sm 28px</div>
    <div class="ctrl" style="height:var(--control-md)">md 34px</div>
    <div class="ctrl" style="height:var(--control-lg)">lg 42px</div>
    <div class="ctrl" style="height:var(--titlebar-h)">titlebar 40px</div>
  </div>
</body>
</html>
